services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contractsphere-db
    environment:
      POSTGRES_DB: contractdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - contractdb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contractdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: contractsphere-backend
    environment:
      SERVER_PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/contractdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-this-to-32-chars-min}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b-instruct}
      BLOCKCHAIN_NOTARY_ENABLED: ${BLOCKCHAIN_NOTARY_ENABLED:-false}
      BLOCKCHAIN_NOTARY_RPC_URL: ${BLOCKCHAIN_NOTARY_RPC_URL:-}
      BLOCKCHAIN_NOTARY_PRIVATE_KEY: ${BLOCKCHAIN_NOTARY_PRIVATE_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: contractsphere-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  contractdb-data:
