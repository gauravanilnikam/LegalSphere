spring.application.name=Backend

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Set to a valid local Ollama model. Make sure it's installed (ollama pull)
# You can change this to any model you have locally, e.g., llama3.1:8b-instruct
spring.ai.ollama.chat.model=${OLLAMA_MODEL:gpt-oss:20b-cloud}


#Ollama Chat Options
#spring.ai.ollama.chat.options.temperature=0.7
#spring.ai.ollama.chat.options.top-p=0.9
#spring.ai.ollama.chat.options.num-predict=8000
#Remove format=json to let Ollama return text format
#spring.ai.ollama.chat.options.format=json
#spring.ai.ollama.chat.options.stream=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contractdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:omjadhav17@}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:3001}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-please-change-this-to-32-chars-min}

# Logging Configuration
logging.level.com.contract.Backend=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Application Configuration
app.name=Contract Sphere AI Backend
app.version=1.0.0

# Blockchain Notary (stores a notarization payload in the transaction input data)
blockchain.notary.enabled=${BLOCKCHAIN_NOTARY_ENABLED:false}
blockchain.notary.rpc-url=${BLOCKCHAIN_NOTARY_RPC_URL:}
blockchain.notary.chain-id=${BLOCKCHAIN_NOTARY_CHAIN_ID:11155111}
blockchain.notary.private-key=${BLOCKCHAIN_NOTARY_PRIVATE_KEY:}
blockchain.notary.to-address=${BLOCKCHAIN_NOTARY_TO_ADDRESS:}
blockchain.notary.gas-limit=${BLOCKCHAIN_NOTARY_GAS_LIMIT:100000}
blockchain.notary.poll-interval-ms=${BLOCKCHAIN_NOTARY_POLL_INTERVAL_MS:1000}
blockchain.notary.receipt-attempts=${BLOCKCHAIN_NOTARY_RECEIPT_ATTEMPTS:45}
